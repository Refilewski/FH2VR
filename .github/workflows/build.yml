name: Build FH2VR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify manifest version
        shell: pwsh
        run: |
          $manifest = Get-Content mod.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne '0.2.1-dev') { throw "Unexpected mod version: $($manifest.version)" }
          if ($manifest.entry -ne 'FH2VR.dll') { throw "Unexpected entry: $($manifest.entry)" }
          if (-not (Test-Path 'build/Release/FH2VR.dll')) { throw 'FH2VR.dll was not produced' }

      - name: Install package
        run: cmake --install build --config Release --prefix package --component FH2VR

      - name: Verify clean package
        shell: pwsh
        run: |
          $expected = @('FH2VR.dll', 'mod.json', 'README.md', 'THIRD_PARTY.md') | Sort-Object
          $actual = Get-ChildItem package -File -Recurse | ForEach-Object { $_.Name } | Sort-Object
          if ($actual.Count -ne $expected.Count) {
            throw "Unexpected package file count: $($actual.Count). Actual: $($actual -join ', ')"
          }
          if (Compare-Object $expected $actual) {
            throw "Unexpected package contents. Actual: $($actual -join ', ')"
          }

      - name: Upload FH2ML package
        uses: actions/upload-artifact@v4
        with:
          name: FH2VR-0.2.1-dev
          path: package/
          if-no-files-found: error
